<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16362d">
<title>Thái Công Truyền Thừa</title>
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<section id="awaken" class="screen">
  <div class="wrap">
    <header class="top">
      <b>Thái Công Truyền Thừa</b>
      <button type="button" class="quiet" id="guide">Lời sư phụ</button>
    </header>
    <section class="hero">
      <div class="hero-copy">
        <h1>Thức tỉnh tiên thiên</h1>
        <p>Chọn ba thiên phú. Rồi đi cho đến khi hết thọ, hoặc đến ngày phi thăng.</p>
      </div>
      <img src="assets/hero.png" alt="Đạo nhân đội nón lá, râu bạc, áo thâm">
    </section>
    <label class="field"><span>Đạo hiệu</span>
      <input id="dao" maxlength="16" placeholder="Đệ tử" autocomplete="off" enterkeyhint="done">
    </label>
    <div class="bar-head">
      <h2>Thiên phú</h2>
      <output id="count" aria-live="polite"></output>
    </div>
    <div class="cards" id="cards"></div>
    <div class="row">
      <button type="button" class="btn" id="roll">Đổi thiên phú</button>
      <button type="button" class="btn primary" id="confirm" disabled>Xuống núi</button>
      <button type="button" class="btn" id="resume" hidden>Tiếp tục hành trình</button>
    </div>
    <p class="status" id="notice" role="status"></p>
  </div>
</section>

<section id="path" class="screen" hidden>
  <div class="path-wrap">
    <header class="top">
      <b id="path-name"></b>
      <button type="button" class="quiet" id="path-guide">Lời sư phụ</button>
    </header>
    <div>
      <article class="realm" id="realm-card">
        <div class="copy">
          <p class="kicker" id="path-year"></p>
          <h1 id="realm-name"></h1>
          <p class="layer-label" id="realm-layer"></p>
          <div class="dots" id="dots"></div>
        </div>
        <img src="assets/hero.png" alt="">
        <div class="meter">
          <div class="meter-top"><span>Tu vi</span><span id="tuvi-label"></span></div>
          <div class="track" aria-hidden="true"><i id="tuvi-bar"></i></div>
        </div>
      </article>
      <div class="vitals">
        <div class="vital hp">
          <div class="meter-top"><span>Sinh lực</span><span id="hp-label"></span></div>
          <div class="track"><i id="hp-bar"></i></div>
        </div>
        <div class="vital">
          <div class="meter-top"><span>Thể lực</span><span id="stam-label"></span></div>
          <div class="track"><i id="stam-bar"></i></div>
        </div>
        <div class="vital life" id="life-card">
          <div class="meter-top"><span>Tuổi thọ</span><span id="life-label"></span></div>
          <div class="track"><i id="life-bar"></i></div>
        </div>
      </div>
      <p class="stats-line" id="stat-line"></p>
      <div class="grid">
        <button type="button" class="act" id="btn-cultivate"><b>Bế quan</b><small>Tích tu vi</small></button>
        <button type="button" class="act" id="btn-explore"><b>Kỳ ngộ</b><small>Xuống núi</small></button>
        <button type="button" class="act" id="btn-rest"><b>Nghỉ ngơi</b><small>Hồi sức</small></button>
        <button type="button" class="act" id="btn-break"><b id="break-label">Phá tầng</b><small id="break-sub"></small></button>
      </div>
      <p class="status" id="path-notice" role="status"></p>
    </div>
    <aside class="journal">
      <h2>Nhật ký</h2>
      <ol id="log"></ol>
    </aside>
  </div>
  <nav class="dock" aria-label="Hành trang">
    <button type="button" id="dock-bag">Hành trang</button>
    <button type="button" id="dock-shop">Chợ</button>
    <button type="button" id="dock-talent">Thiên phú</button>
  </nav>
</section>

<section id="end" class="screen" hidden>
  <img src="assets/hero.png" alt="">
  <p class="kicker" id="end-kicker"></p>
  <h1 id="end-title"></h1>
  <p id="end-text"></p>
  <dl id="end-stats"></dl>
  <button type="button" class="btn primary" id="end-again">Tu lại từ đầu</button>
</section>

<dialog id="modal" aria-labelledby="modal-title">
  <div class="modal-head">
    <h2 id="modal-title"></h2>
    <button type="button" class="quiet" id="modal-x" aria-label="Đóng">×</button>
  </div>
  <div id="modal-body"></div>
  <div class="modal-actions" id="modal-actions"></div>
</dialog>
<div id="floaters" aria-hidden="true"></div>
<p id="live" class="sr" aria-live="polite"></p>
<script src="js/config.js"></script>
<script src="js/rules.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
