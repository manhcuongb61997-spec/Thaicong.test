<div class="bar"><h2>Thiên phú</h2><output id="count" aria-live="polite"></output></div>
<div class="cards" id="cards"></div>
<div class="actions"><button class="btn" id="roll">Đổi thiên phú</button><button class="btn primary" id="confirm" disabled>Xác nhận</button></div>
<p class="status" role="status" id="notice"></p>
</main>
<dialog aria-labelledby="title" id="dialog"><h2 id="title"></h2><p id="message"></p><button class="btn primary" id="back">Quay lại</button></dialog>
<script>
"use strict";
// Tên và hiệu ứng được dịch từ bảng thiên phú của bản Windows.
const pool = [
 ["Cần học khổ luyện","Nhận thêm 20% tu vi.",1],
 ["Gia tài bạc triệu","Khởi đầu với thêm 1.000 linh thạch.",1],
 ["Phù lục thế gia","Khởi đầu với thêm hai lá phù ngẫu nhiên.",1],
 ["Dị ma nhập thể","Tăng 20% sức tấn công, giảm 20 năm tuổi thọ.",1],
 ["Quy thọ","Tăng 20% phòng thủ và thêm 20 năm tuổi thọ.",1],
 ["Tiên nhân tri kỷ","Mở sớm một ô pháp bảo khi bắt đầu.",1],
 ["Mệnh nghèo","Bán đồ thu ít hơn 50% linh thạch. Học công pháp tốn ít hơn 50% linh thạch.",1],
 ["Tái tạo gân cốt","Tăng 10% sức tấn công, phòng thủ và thể lực.",1],
 ["Tầm bảo","Tăng 5% cơ hội tìm được pháp bảo trong kỳ ngộ.",1],
 ["Tầm pháp","Tăng 5% cơ hội tìm được công pháp trong kỳ ngộ.",1],
 ["Học đi đôi với nghĩ","Tăng 10% hiệu quả của công pháp học được.",1],
 ["Tinh giản công pháp","Học công pháp tốn ít hơn 30% linh thạch, nhưng hiệu quả giảm 15%.",2],
 ["Một môn tinh thông","Tăng 200% hiệu quả công pháp, nhưng chỉ học được ba môn.",3],
 ["Quy giáp công","Tăng 15% phòng thủ và 10% thể lực.",1],
 ["Khéo dùng pháp bảo","Pháp bảo thu được có sức tấn công cao hơn 10%.",1]
];
const cards=document.getElementById("cards"), counter=document.getElementById("count"), notice=document.getElementById("notice"), confirmBtn=document.getElementById("confirm"), dialog=document.getElementById("dialog");
let hand=[0,1,3,6,11,12], chosen=new Set();
function update(){
 counter.textContent=chosen.size+" / 3";
 confirmBtn.disabled=chosen.size!==3;
 for(const card of cards.children){
  const selected=chosen.has(Number(card.dataset.id)); card.setAttribute("aria-pressed",String(selected));
  card.lastElementChild.textContent=selected?"✓ Đã chọn":"";
 }
}
function draw(){
 cards.replaceChildren();
 for(const id of hand){
  const [name,desc,rank]=pool[id], card=document.createElement("button");card.type="button";card.className="card";card.dataset.id=id;card.style.setProperty("--trim",["","#aa9261","#668479","#8b7395"][rank]);
  for(const [tag,value] of [["b",name],["small",desc],["span",""]]){
   const part=document.createElement(tag);part.textContent=value;if(tag==="span")part.className="check";card.append(part);
  }
  card.onclick=()=>{notice.textContent="";if(chosen.has(id))chosen.delete(id);else if(chosen.size<3)chosen.add(id);else notice.textContent="Bạn đã chọn đủ ba. Hãy bỏ chọn một thiên phú trước.";update();};
  cards.append(card);
 }
 update();
}
function show(title,text){document.getElementById("title").textContent=title;document.getElementById("message").textContent=text;dialog.showModal();}
document.getElementById("guide").onclick=()=>show("Lời Thái Công","Từ nhỏ con đã sáng dạ, lại sớm thức tỉnh thiên phú. Hãy xem kỹ từng năng lực rồi chọn ba thiên phú để mang theo.");
document.getElementById("back").onclick=()=>dialog.close();
confirmBtn.onclick=()=>show("Thiên phú đã chọn",Array.from(chosen,id=>pool[id][0]+"\n"+pool[id][1]).join("\n\n"));
document.getElementById("roll").onclick=()=>{const ids=pool.map((_,i)=>i);for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}hand=ids.slice(0,6);chosen.clear();draw();notice.textContent="Đã đổi sáu thiên phú.";};
draw();
</script></body></html>
